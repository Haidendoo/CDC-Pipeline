services:
  postgres_db:
    image: postgres:16-alpine
    container_name: my_postgres_container
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
      TZ: UTC
      PGTZ: UTC
    # IMPORTANT: We must tell Postgres to allow logical replication
    command: ["postgres", "-c", "wal_level=logical", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: my_rabbitmq_container
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI

  debezium:
    image: quay.io/debezium/server:3.0.0.Final
    container_name: my_debezium_server
    volumes:
      - ./debezium_conf:/debezium/conf  # You need to map a config file here
    depends_on:
      - postgres_db
      - rabbitmq

  clickhouse:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: my_clickhouse_container
    command: clickstack
    ports:
      - "8123:8123"   # HTTP interface
      - "8080:8080"   # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse_users.xml:/etc/clickhouse-server/users.d/default-password.xml
      - ./mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8123/ping | grep -q Ok."]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  dbt:
    build:
      context: .
      dockerfile: dbt.Dockerfile
    container_name: my_dbt_container
    working_dir: /usr/app/dbt
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./dbt:/usr/app/dbt
      - ./dbt/profiles.yml:/usr/app/.dbt/profiles.yml:ro
    ports:
      - "8081:8080"
    command: >
      sh -c "dbt deps
      && dbt debug
      && dbt build
      && dbt docs generate
      && dbt docs serve --host 0.0.0.0 --port 8080"
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data: