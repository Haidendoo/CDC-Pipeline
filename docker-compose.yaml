services:
  postgres_db:
    image: postgres:16-alpine
    container_name: my_postgres_container
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
      TZ: UTC
      PGTZ: UTC
    # IMPORTANT: We must tell Postgres to allow logical replication
    command: ["postgres", "-c", "wal_level=logical", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: my_rabbitmq_container
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  debezium:
    image: quay.io/debezium/server:3.0.0.Final
    container_name: my_debezium_server
    healthcheck:
      test: curl http://localhost:8080/q/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
    volumes:
      - ./debezium_conf:/debezium/config
      - ./debezium_data:/debezium/data
    depends_on:
      postgres_db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: my_clickhouse_container
    command: clickstack
    ports:
      - "8123:8123"   # HTTP interface
      - "8083:8080"   # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse_users.xml:/etc/clickhouse-server/users.d/default-password.xml
      - ./clickhouse_init:/docker-entrypoint-initdb.d
      - ./mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8123/ping | grep -q Ok."]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  dbt:
    build:
      context: .
      dockerfile: dbt.Dockerfile
    container_name: my_dbt_container
    working_dir: /usr/app/dbt
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./dbt:/usr/app/dbt
      - ./dbt/profiles.yml:/usr/app/.dbt/profiles.yml:ro
    ports:
      - "8081:8080"
    command: >
      sh -c "dbt deps
      && dbt debug
      && dbt run
      && dbt parse
      && dbt docs serve --host 0.0.0.0 --port 8080"
    restart: unless-stopped

  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: my_streamlit_agent
    depends_on:
      clickhouse:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_USER: api
      CH_PASSWORD: api
      CH_DATABASE: default
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: my_ollama_container
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  rabbitmq_data:
  ollama_data: